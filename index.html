<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthsary ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: 0.8s;
        }

        /* transparent mode */
        body.transparent {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }

        .container {
            text-align: center;
            color: #fff;
            animation: slideIn 2s ease;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 3rem;
        }

        p {
            margin-top: 10px;
            font-size: 1.2rem;
            opacity: 0.9;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #fff;
            color: #ff6b81;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff6b81;
            color: #fff;
        }

        /* glowing button */
        .glow {
            box-shadow: 0 0 15px #fff, 0 0 30px #ff6b81;
        }

        .gallery {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            animation: fadeIn 1s ease;
            z-index: 3;
        }

        .gallery img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.1);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 30px;
            color: white;
            cursor: pointer;
        }

        .language-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            background: #fff;
            color: #ff6b81;
            cursor: pointer;
            z-index: 2;
        }

        .fade {
            animation: fadeText 0.5s ease;
        }

        /* floating hearts */
        .hearts {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            bottom: -20px;
            width: 12px;
            height: 12px;
            background: #ff6b81;
            transform: rotate(45deg);
            opacity: 0.8;
            animation: floatUp linear forwards;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ff6b81;
            border-radius: 50%;
        }

        .heart::before {
            left: -6px;
        }

        .heart::after {
            top: -6px;
        }

        /* sparkles */
        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            animation: sparkleAnim 2s linear infinite;
        }

        @keyframes sparkleAnim {
            0% {
                opacity: 0;
                transform: scale(0);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(45deg);
                opacity: 0.9;
            }

            100% {
                transform: translateY(-110vh) scale(1.4) rotate(45deg);
                opacity: 0;
            }
        }

        @keyframes fadeText {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }


        /* animated background gradient move */
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        body {
            background-size: 200% 200%;
            animation: gradientMove 10s ease infinite;
        }

        /* floating love text */
        .love-text {
            position: fixed;
            color: white;
            font-size: 14px;
            opacity: 0.7;
            animation: floatText 6s linear forwards;
            pointer-events: none;
        }

        @keyframes floatText {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh);
                opacity: 0;
            }
        }

        /* image click fullscreen */
        .gallery img:active {
            transform: scale(2);
            z-index: 5;
        }

        /* pulse animation for title */
        h1 {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="hearts" id="hearts"></div>

    <button class="language-btn" onclick="toggleLanguage()">🌐 Translate</button>

    <div class="container">
        <h1 id="title">Happy 16th Monthsary Love❤️</h1>
        <h1>I LOVE YOU</h1>
        <p id="message">Every moment with you is special 💕</p>
        <button id="mainBtn" onclick="activateDesign()">See Our Memories</button>
    </div>

    <div class="gallery" id="gallery">
        <span class="close" onclick="closeGallery()">&times;</span>
        <img src="images/images1.jpg">
        <img src="images/images2.jpg">
        <img src="images/images3.jpg">
        <img src="images/images4.jpg">
        <img src="images/images5.jpg">
        <img src="images/images6.jpg">
        <img src="images/images8.jpg">
        <img src="images/images9.jpeg">
        <img src="images/images10.jpeg">
       
    </div>

    <script>
        let isEnglish = true;

        function toggleLanguage() {
            const title = document.getElementById('title');
            const message = document.getElementById('message');

            title.classList.remove('fade');
            message.classList.remove('fade');
            void title.offsetWidth;
            title.classList.add('fade');
            message.classList.add('fade');

            if (isEnglish) {
                title.innerText = "Maligayang Monthsary ❤️";
                message.innerText = "Bawat sandali kasama ka ay espesyal 💕";
            } else {
                title.innerText = "Happy Monthsary ❤️";
                message.innerText = "Every moment with you is special 💕";
            }
            isEnglish = !isEnglish;
        }

        function activateDesign() {
            document.body.classList.add('transparent');
            document.getElementById('gallery').style.display = 'flex';
            document.getElementById('mainBtn').classList.add('glow');

            // add sparkles
            for (let i = 0; i < 30; i++) {
                let s = document.createElement('div');
                s.className = 'sparkle';
                s.style.left = Math.random() * 100 + 'vw';
                s.style.top = Math.random() * 100 + 'vh';
                s.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(s);
            }
        }

        function closeGallery() {
            document.getElementById('gallery').style.display = 'none';
        }

        // hearts generator
        const heartsContainer = document.getElementById('hearts');
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';

            const size = 8 + Math.random() * 12;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';

            const duration = 4 + Math.random() * 4;
            heart.style.animationDuration = duration + 's';

            heartsContainer.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }
        setInterval(createHeart, 300);

        // floating love words
        function createLoveText() {
            const texts = ["I love you 💖", "Forever ♾", "My love 💕", "You & Me ❤️"];
            const el = document.createElement('div');
            el.className = 'love-text';
            el.innerText = texts[Math.floor(Math.random() * texts.length)];
            el.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 6000);
        }
        setInterval(createLoveText, 2000);
    </script>

</body>

</html>
